name: Bug report
description: Something in Gentle Office does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do **not** paste real prompts, session logs, tokens or office URLs. Security issues go through [SECURITY.md](https://github.com/MataM15/gentle-office/blob/main/SECURITY.md), not public issues.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start `node src/server.mjs --hub`
        2. Run `/office` in Pi
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Single session (`node src/server.mjs`)
        - Hub (`--hub` or `/office`)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gentle Office version or commit
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS (and WSL if relevant), Node.js version and browser.
      placeholder: Ubuntu 24.04 on WSL, Node 22.13, Edge 130
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove the token from any URL and use synthetic data where possible.
